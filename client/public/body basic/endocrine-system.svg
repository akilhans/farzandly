<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" rx="24" fill="url(#bgGrad)" />

  <!-- Grid lines subtle -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="650" />
    <line x1="250" y1="0" x2="250" y2="650" />
    <line x1="400" y1="0" x2="400" y2="650" />
    <line x1="550" y1="0" x2="550" y2="650" />
    <line x1="700" y1="0" x2="700" y2="650" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="530" x2="800" y2="530" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#38bdf8" filter="url(#glow)" />
    <text x="34" y="22" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">ENDOCRINE SYSTEM / ENDOKRIN TIZIMI</text>
  </g>

  <!-- Central Body Silhouette -->
  <g id="body-silhouette" transform="translate(400, 80)">
    <!-- Head & Neck -->
    <path d="M-35,40 C-35,-10 35,-10 35,40 C35,70 20,85 20,105 C20,115 15,120 15,125 L-15,125 C-15,120 -20,115 -20,105 C-20,85 -35,70 -35,40 Z" fill="url(#bodyGrad)" stroke="#38bdf8" stroke-width="2" />
    <!-- Torso -->
    <path d="M-15,125 C-45,130 -85,150 -95,200 C-105,245 -95,300 -85,350 C-80,380 -70,410 -60,450 C-40,490 -20,500 0,500 C20,500 40,490 60,450 C70,410 80,380 85,350 C95,300 105,245 95,200 C85,150 45,130 15,125 Z" fill="url(#bodyGrad)" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- GLANDS & LABELS -->

  <!-- 1. Hypothalamus & Pituitary -->
  <g transform="translate(400, 115)">
    <circle cx="0" cy="0" r="7" fill="#f43f5e" filter="url(#glow)" stroke="#fff" stroke-width="1.5" />
    <!-- Pointer line to left -->
    <path d="M-7,-2 L-120,-30 L-220,-30" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3" />
    <g transform="translate(-360, -50)">
      <rect width="135" height="42" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
      <text x="12" y="18" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Hypothalamus</text>
      <text x="12" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Gipotalamus (Markaz)</text>
    </g>
    <!-- Pointer line to right (Pituitary) -->
    <path d="M7,3 L120,-10 L220,-10" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="4,3" />
    <g transform="translate(225, -30)">
      <rect width="145" height="42" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5" />
      <text x="12" y="18" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Pituitary ("Master")</text>
      <text x="12" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Gipofiz (Bosh bez)</text>
    </g>
  </g>

  <!-- 2. Pineal Gland -->
  <g transform="translate(400, 95)">
    <circle cx="0" cy="0" r="5" fill="#a855f7" filter="url(#glow)" stroke="#fff" stroke-width="1" />
    <path d="M-5,-1 L-100,-15 L-200,-15" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <g transform="translate(-330, -32)">
      <rect width="125" height="36" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
      <text x="10" y="16" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Pineal Gland</text>
      <text x="10" y="28" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Epifiz (Melatonin)</text>
    </g>
  </g>

  <!-- 3. Thyroid & Parathyroids -->
  <g transform="translate(400, 190)">
    <!-- Butterfly shape thyroid -->
    <path d="M-14,-8 C-8,-14 -4,-6 0,-2 C4,-6 8,-14 14,-8 C18,0 12,12 5,10 C2,10 1,6 0,6 C-1,6 -2,10 -5,10 C-12,12 -18,0 -14,-8 Z" fill="#38bdf8" filter="url(#glow)" stroke="#fff" stroke-width="1.5" />
    <!-- Parathyroid dots -->
    <circle cx="-6" cy="-2" r="2" fill="#facc15" />
    <circle cx="6" cy="-2" r="2" fill="#facc15" />
    <circle cx="-6" cy="4" r="2" fill="#facc15" />
    <circle cx="6" cy="4" r="2" fill="#facc15" />

    <path d="M-15,0 L-130,20 L-220,20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" />
    <g transform="translate(-360, 0)">
      <rect width="135" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="12" y="18" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Thyroid Gland</text>
      <text x="12" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Qalqonsimon bez</text>
    </g>

    <path d="M15,0 L130,15 L220,15" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4,3" />
    <g transform="translate(225, -5)">
      <rect width="145" height="42" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="1.5" />
      <text x="12" y="18" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Parathyroids</text>
      <text x="12" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Qalqonoldi (Kalsiy)</text>
    </g>
  </g>

  <!-- 4. Thymus -->
  <g transform="translate(400, 245)">
    <circle cx="0" cy="0" r="6" fill="#10b981" filter="url(#glow)" stroke="#fff" stroke-width="1.2" />
    <path d="M-6,0 L-100,-5 L-190,-5" fill="none" stroke="#10b981" stroke-width="1.5" />
    <g transform="translate(-315, -22)">
      <rect width="120" height="36" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="10" y="16" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Thymus Gland</text>
      <text x="10" y="28" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Timus (T-hujayralar)</text>
    </g>
  </g>

  <!-- 5. Adrenal Glands & Kidneys -->
  <g transform="translate(400, 360)">
    <!-- Adrenals on kidneys -->
    <path d="M-38,-6 L-24,-16 L-14,-6 Z" fill="#fbbf24" filter="url(#glow)" stroke="#fff" stroke-width="1" />
    <path d="M38,-6 L24,-16 L14,-6 Z" fill="#fbbf24" filter="url(#glow)" stroke="#fff" stroke-width="1" />
    <!-- Kidney shapes outline -->
    <path d="M-36,-2 C-45,-2 -48,15 -35,22 C-26,26 -20,18 -26,8 C-28,4 -32,-2 -36,-2 Z" fill="#64748b" opacity="0.6" />
    <path d="M36,-2 C45,-2 48,15 35,22 C26,26 20,18 26,8 C28,4 32,-2 36,-2 Z" fill="#64748b" opacity="0.6" />

    <path d="M-30,-10 L-120,-10 L-220,-10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" />
    <g transform="translate(-360, -30)">
      <rect width="135" height="42" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
      <text x="12" y="18" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Adrenal Glands</text>
      <text x="12" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Buyrak usti (Adrenalin)</text>
    </g>
  </g>

  <!-- 6. Pancreas -->
  <g transform="translate(400, 395)">
    <!-- Pancreas shape -->
    <path d="M-25,-4 C-10,-10 20,-2 28,4 C25,12 10,8 -5,6 C-18,6 -28,2 -25,-4 Z" fill="#f97316" filter="url(#glow)" stroke="#fff" stroke-width="1.5" />

    <path d="M28,4 L120,5 L220,5" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4,3" />
    <g transform="translate(225, -15)">
      <rect width="145" height="42" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
      <text x="12" y="18" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Pancreas (Insulin)</text>
      <text x="12" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Oshqozon osti bezi</text>
    </g>
  </g>

  <!-- 7. Reproductive Gonads (Ovaries / Testes) -->
  <g transform="translate(400, 490)">
    <circle cx="-20" cy="0" r="7" fill="#ec4899" filter="url(#glow)" stroke="#fff" stroke-width="1.2" />
    <circle cx="20" cy="0" r="7" fill="#06b6d4" filter="url(#glow)" stroke="#fff" stroke-width="1.2" />

    <path d="M-27,0 L-120,20 L-220,20" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,3" />
    <g transform="translate(-360, 0)">
      <rect width="135" height="42" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="12" y="18" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Ovaries (Females)</text>
      <text x="12" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Tuxumdonlar (Estrogen)</text>
    </g>

    <path d="M27,0 L120,20 L220,20" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,3" />
    <g transform="translate(225, 0)">
      <rect width="145" height="42" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="12" y="18" fill="#cffafe" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Testes (Males)</text>
      <text x="12" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Urug‘don (Testosteron)</text>
    </g>
  </g>

  <!-- Bottom Medical Review attribution -->
  <g transform="translate(40, 600)">
    <text x="0" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      Farzandly Body Basics • Medically reviewed by KidsHealth Experts • Gormonlar va tana regulyatsiyasi
    </text>
  </g>
</svg>
