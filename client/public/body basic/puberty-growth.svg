<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="maleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#172554" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="femaleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#500724" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="650" rx="24" fill="url(#bgGrad3)" />

  <!-- Title Badge -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="370" height="34" rx="17" fill="#818cf8" fill-opacity="0.2" stroke="#a5b4fc" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#a5b4fc" filter="url(#glow3)" />
    <text x="34" y="22" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">UNDERSTANDING PUBERTY / BALOG‘AT DAVRI</text>
  </g>

  <!-- Left Column: Males (O‘g‘il bolalar) -->
  <g transform="translate(40, 90)">
    <rect width="345" height="480" rx="16" fill="url(#maleCard)" stroke="#38bdf8" stroke-width="1.5" />
    <g transform="translate(20, 24)">
      <rect width="40" height="40" rx="10" fill="#0284c7" />
      <text x="13" y="27" fill="#fff" font-family="system-ui, sans-serif" font-size="20">👦</text>
      <text x="50" y="20" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="16" font-weight="900">Males / O‘g‘il bolalar</text>
      <text x="50" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Odatiy yosh: 9 – 14 yosh</text>
    </g>

    <!-- Key Changes List -->
    <g transform="translate(20, 90)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="4" fill="#38bdf8" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Testosterone & Hormones</text>
        <text x="22" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Testosteron gormoni faollashadi</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 50)">
        <circle cx="8" cy="8" r="4" fill="#38bdf8" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Growth Spurt (Bo‘y cho‘zilishi)</text>
        <text x="22" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">12-15 yosh oralig‘ida tez bo‘y o‘sishi</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 100)">
        <circle cx="8" cy="8" r="4" fill="#38bdf8" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Voice Deepening (Ovoz o‘zgarishi)</text>
        <text x="22" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Hiqildoq kengayadi, ovoz yo‘g‘onlashadi</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 150)">
        <circle cx="8" cy="8" r="4" fill="#38bdf8" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Muscle & Broad Shoulders</text>
        <text x="22" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Yelkalar kengayib, mushaklar rivojlanadi</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(0, 200)">
        <circle cx="8" cy="8" r="4" fill="#38bdf8" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Facial & Body Hair</text>
        <text x="22" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Mo‘ylov, soqol va tana tuklari o‘sishi</text>
      </g>
      <!-- Item 6 -->
      <g transform="translate(0, 250)">
        <circle cx="8" cy="8" r="4" fill="#38bdf8" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Skin & Hygiene (Teri va ter)</text>
        <text x="22" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Akne (husnbuzar) va muntazam gigiyena</text>
      </g>
    </g>

    <!-- Support Box -->
    <g transform="translate(15, 410)">
      <rect width="315" height="50" rx="10" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="22" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">💡 Maslahat:</text>
      <text x="12" y="38" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10">O‘g‘il bolalar uchun bu tabiiy ulg‘ayish bosqichidir.</text>
    </g>
  </g>

  <!-- Right Column: Females (Qiz bolalar) -->
  <g transform="translate(415, 90)">
    <rect width="345" height="480" rx="16" fill="url(#femaleCard)" stroke="#f472b6" stroke-width="1.5" />
    <g transform="translate(20, 24)">
      <rect width="40" height="40" rx="10" fill="#be185d" />
      <text x="13" y="27" fill="#fff" font-family="system-ui, sans-serif" font-size="20">👧</text>
      <text x="50" y="20" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="16" font-weight="900">Females / Qiz bolalar</text>
      <text x="50" y="34" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11">Odatiy yosh: 8 – 13 yosh</text>
    </g>

    <!-- Key Changes List -->
    <g transform="translate(20, 90)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="4" fill="#f472b6" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Estrogen & Progesterone</text>
        <text x="22" y="28" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11">Ayollik gormonlari faollashadi</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 50)">
        <circle cx="8" cy="8" r="4" fill="#f472b6" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Breast Development (Ko‘krak rivojlanishi)</text>
        <text x="22" y="28" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11">Dastlabki ko‘krak kurtaklari (buds) shakllanadi</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 100)">
        <circle cx="8" cy="8" r="4" fill="#f472b6" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Growth Spurt (Bo‘y cho‘zilishi)</text>
        <text x="22" y="28" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11">Hayzdan 1-2 yil avval tez bo‘y o‘sishi</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 150)">
        <circle cx="8" cy="8" r="4" fill="#f472b6" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Body Shape & Hips</text>
        <text x="22" y="28" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11">Tos suyaklari kengayib, qomat o‘zgaradi</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(0, 200)">
        <circle cx="8" cy="8" r="4" fill="#f472b6" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Menstruation (Birinchi hayz)</text>
        <text x="22" y="28" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11">Odatda 9-16 yosh orasida boshlanadi</text>
      </g>
      <!-- Item 6 -->
      <g transform="translate(0, 250)">
        <circle cx="8" cy="8" r="4" fill="#f472b6" />
        <text x="22" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Emotional Changes (Tuyg‘ular)</text>
        <text x="22" y="28" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11">Kayfiyat o‘zgaruvchanligi va shaxsiy maydon</text>
      </g>
    </g>

    <!-- Support Box -->
    <g transform="translate(15, 410)">
      <rect width="315" height="50" rx="10" fill="#9d174d" fill-opacity="0.4" stroke="#f472b6" stroke-width="1" />
      <text x="12" y="22" fill="#fce7f3" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">💡 Maslahat:</text>
      <text x="12" y="38" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10">Ota-ona bilan samimiy va ochiq suhbat juda muhim.</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 600)">
    <text x="0" y="20" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      Farzandly Body Basics • Medically reviewed by KidsHealth Experts • O‘smirlik va jismoniy yetilish
    </text>
  </g>
</svg>
