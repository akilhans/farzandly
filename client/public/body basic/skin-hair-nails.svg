<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgInteg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="epidermisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="dermisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="subcutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bgInteg)" />

  <!-- Section Title -->
  <g transform="translate(450, 45)">
    <rect x="-240" y="-20" width="480" height="42" rx="21" fill="#065f46" stroke="#34d399" stroke-width="2" />
    <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      INTEGUMENTARY SYSTEM • SOCH, TERI VA TIRNOQLAR
    </text>
  </g>

  <!-- Left: Skin & Hair Follicle Cross-Section (Width: 500) -->
  <g transform="translate(50, 100)">
    <!-- Diagram Card Background -->
    <rect width="480" height="490" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#38bdf8">
      TERI QATLAMLARI VA SOCH FOLLIKULASI
    </text>
    <text x="25" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
      Epidermis, Dermis va Gipoderma (Subcutaneous) tuzilishi
    </text>

    <!-- 1. Epidermis Layer (y: 80 to 140) -->
    <rect x="25" y="80" width="430" height="60" rx="8" fill="url(#epidermisGrad)" opacity="0.9" />
    <text x="35" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#831843">
      1. EPIDERMIS (Tashqi qatlam)
    </text>
    <text x="240" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#500724">
      Keratin &amp; Melanin hujayralari
    </text>

    <!-- 2. Dermis Layer (y: 150 to 330) -->
    <rect x="25" y="150" width="430" height="170" rx="8" fill="url(#dermisGrad)" opacity="0.85" />
    <text x="35" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#431407">
      2. DERMIS (Asosiy qatlam)
    </text>
    <text x="35" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#431407">
      Qon tomirlari, nerv uchlari, yog‘ bezlari (Sebum), kollagen va elastin
    </text>

    <!-- 3. Subcutaneous Layer (y: 330 to 450) -->
    <rect x="25" y="330" width="430" height="120" rx="8" fill="url(#subcutGrad)" opacity="0.85" />
    <text x="35" y="360" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#713f12">
      3. GIPODERMA / SUBCUTANEOUS (Teriosti yog‘ qatlami)
    </text>
    <text x="35" y="380" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#713f12">
      Zarbalarni yumshatuvchi yog‘ to‘qimasi va yirik qon tomirlar
    </text>

    <!-- Hair Shaft and Follicle Drawing in the center -->
    <!-- Hair shaft going up out of skin -->
    <path d="M 330,20 L 330,370" stroke="#451a03" stroke-width="10" stroke-linecap="round" />
    <path d="M 330,-20 L 330,80" stroke="#78350f" stroke-width="8" stroke-linecap="round" />

    <!-- Hair Follicle Pocket -->
    <path d="M 315,90 L 315,350 Q 315,395 330,395 Q 345,395 345,350 L 345,90" 
          fill="none" stroke="#ffe4e6" stroke-width="4" />
    <!-- Hair Bulb / Papilla at base -->
    <ellipse cx="330" cy="385" rx="14" ry="16" fill="#be123c" />
    <circle cx="330" cy="385" r="7" fill="#fbbf24" />
    <text x="355" y="390" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fecdd3">
      Soch ildizi (Papilla)
    </text>

    <!-- Sebaceous Gland on hair side -->
    <circle cx="300" cy="220" r="14" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <circle cx="290" cy="235" r="12" fill="#fde047" stroke="#ca8a04" stroke-width="2" />
    <text x="210" y="235" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">
      Yog‘ bezi ➔
    </text>

    <!-- Sweat Gland coil -->
    <path d="M 120,380 Q 135,360 120,340 Q 105,320 120,300 L 120,80" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <text x="80" y="415" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">
      Ter bezi naychasi
    </text>
  </g>

  <!-- Right: Nail Anatomy Diagram (Width: 320) -->
  <g transform="translate(560, 100)">
    <rect width="290" height="490" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#f43f5e">
      TIRNOQ ANATOMIYASI
    </text>
    <text x="25" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
      Keratin qatlamlari va o‘sish matritsasi
    </text>

    <!-- Finger & Nail Illustration -->
    <!-- Finger contour -->
    <path d="M 40,320 C 40,180 80,140 145,140 C 210,140 250,180 250,320" 
          fill="#fed7aa" stroke="#fb923c" stroke-width="4" />

    <!-- Nail plate -->
    <path d="M 70,250 C 70,165 95,150 145,150 C 195,150 220,165 220,250 Z" 
          fill="#fbcfe8" stroke="#f472b6" stroke-width="3" />

    <!-- Lunula (White crescent) -->
    <path d="M 115,250 C 115,225 130,220 145,220 C 160,220 175,225 175,250 Z" 
          fill="#ffffff" opacity="0.9" />

    <!-- Cuticle at base -->
    <path d="M 60,250 C 90,260 200,260 230,250" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" />

    <!-- Labels for nail parts -->
    <g transform="translate(25, 290)">
      <rect width="240" height="40" rx="10" fill="#1e293b" />
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">
        🌙 Lunula: Oq yarim oy shakli
      </text>
    </g>

    <g transform="translate(25, 340)">
      <rect width="240" height="40" rx="10" fill="#1e293b" />
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">
        🛡️ Tirnoq plastinkasi: Keratin
      </text>
    </g>

    <g transform="translate(25, 390)">
      <rect width="240" height="40" rx="10" fill="#1e293b" />
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">
        🌱 Matritsa: Jonli o‘sish markazi
      </text>
    </g>

    <g transform="translate(25, 440)">
      <rect width="240" height="35" rx="10" fill="#064e3b" />
      <text x="120" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">
        Yozda tirnoqlar tezroq o‘sadi ☀️
      </text>
    </g>
  </g>
</svg>
